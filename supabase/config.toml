project_id = "lchaboncmgcimafpupad"

# A Meta chama o webhook sem JWT do Supabase.
[functions.whatsapp-webhook]
verify_jwt = false

# Ferramenta administrativa de diagnóstico (dry-run do scheduler), não uma
# API para usuário final -- autenticação própria via SCHEDULER_DRY_RUN_ADMIN_TOKEN
# (ver index.ts), não o JWT de usuário final do Supabase.
[functions.whatsapp-scheduler-dry-run]
verify_jwt = false

# Pipeline outbound (materialização -> reconciliação -> envio). Chamado só
# pelo cron, com autenticação própria (WHATSAPP_DISPATCHER_TOKEN, ver
# whatsapp-dispatcher/handler.ts), não pelo JWT de usuário do app.
[functions.whatsapp-dispatcher]
verify_jwt = false

# Onboarding (Embedded Signup). `config` e `complete` são chamadas pela página
# web de onboarding, que se autentica com o state de uso único; as ações do app
# validam o JWT dentro da function (auth.getUser). Ver whatsapp-connect/index.ts.
[functions.whatsapp-connect]
verify_jwt = false
