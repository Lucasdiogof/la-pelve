name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flutter:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.1"
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter analyze --no-pub
      - run: flutter test --no-pub

  edge-functions:
    name: Edge Function unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run pure TypeScript tests without production credentials
        shell: bash
        run: |
          mapfile -t tests < <(find supabase/functions -type f -name '*.test.ts' | sort)
          if [ ${#tests[@]} -eq 0 ]; then
            echo "No TypeScript tests found."
            exit 1
          fi
          node --experimental-strip-types --test "${tests[@]}"
